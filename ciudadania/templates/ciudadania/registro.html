{% extends "ciudadania/_base_publica.html" %}
{% block title %}Crear cuenta{% endblock %}

{% block content %}
<section class="max-w-sm mx-auto">
    <div class="text-center mb-6">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-accent/10 border border-brand-accent/20 text-brand-accent text-xs font-black uppercase tracking-[0.2em] font-mono">
            <span class="w-1.5 h-1.5 bg-brand-accent rounded-full animate-pulse"></span>
            <span>Acceso Ciudadano</span>
        </div>
        <h1 class="mt-3 text-2xl font-black text-gray-950 tracking-tight">Crear cuenta</h1>
    </div>

    <div class="bg-white p-6 rounded-[24px] border border-gray-200/90 shadow-2xs">
        <form method="post" class="space-y-4 form-as-p [&_.errorlist]:text-xs [&_.errorlist]:text-red-600 [&_.errorlist]:font-bold [&_.errorlist]:list-none [&_.errorlist]:p-0 [&_.errorlist]:m-0 [&_.helptext]:text-xs [&_.helptext]:text-gray-400 [&_.helptext]:font-medium">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-brand-primary hover:brightness-110 text-white font-black py-3 rounded-xl text-xs uppercase tracking-widest transition shadow-sm cursor-pointer">
                Registrarme
            </button>
        </form>
    </div>
</section>
{% endblock %}
