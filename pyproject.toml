[project]
name = "axentra-ciudadania"
version = "0.1.0"
description = "Identidad ciudadana — satélite instalable de Axentra OS, independiente del expediente laboral de personal (security.User)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django>=6.0.6",
    "python-decouple>=3.8",
    "pillow>=12.2.0",
    "img2pdf>=0.5.1",
]

[dependency-groups]
dev = [
    "dj-database-url>=3.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Solo el paquete de la app se distribuye — devproject/ y manage.py son
# nada más para desarrollar/probar este repo aislado (ver README).
packages = ["ciudadania"]
